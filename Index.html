<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ignacia 💖</title>

<style>
body{
    margin:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
    background: radial-gradient(circle at top, #1a001a, #000);
}

/* ESTRELLAS */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    animation:parpadeo 2s infinite alternate;
}
@keyframes parpadeo{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* CORAZÓN */
.heart{
    position:relative;
    width:400px;
    height:400px;
}

.latir{
    animation:latido 1.5s infinite;
}

@keyframes latido{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* TEXTO CORAZÓN */
.text{
    position:absolute;
    font-size:14px;
    color:#ff4da6;
    text-shadow:0 0 5px #ff4da6, 0 0 10px #ff4da6;
    opacity:0;
    transform:scale(0.5);
    transition:all 0.3s ease;
}

.text.show{
    opacity:1;
    transform:scale(1);
}

/* CAMBIO DE COLOR */
.colorChange{
    animation:color 3s infinite;
}

@keyframes color{
    0%{color:#ff4da6;}
    50%{color:#ff99cc;}
    100%{color:#ff4da6;}
}

/* MENSAJE */
#mensaje{
    position:fixed;
    bottom:20px;
    text-align:center;
    color:white;
    opacity:0;
    transition:1s;
}

/* EMOJIS */
.emoji{
    position:absolute;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(-10vh);}
    100%{transform:translateY(110vh);}
}
</style>
</head>

<body>

<div class="heart" id="heart"></div>

<div id="mensaje">
Amor mio amo cada parte de ti 💖<br>
Eres lo mejor que me ha pasado<br>
<b>Te Amo Mucho Ignacia 💕</b>
</div>

<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const heart = document.getElementById("heart");
const mensaje = document.getElementById("mensaje");

/* CORAZÓN */
let puntos=[];
for(let t=0;t<Math.PI*2;t+=0.1){
    let x=16*Math.pow(Math.sin(t),3);
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    puntos.push({x,y});
}

let elementos=[];
puntos.forEach(p=>{
    let span=document.createElement("span");
    span.className="text";
    span.innerText="Ignacia";
    span.style.left=(200+p.x*10)+"px";
    span.style.top=(200+p.y*10)+"px";
    heart.appendChild(span);
    elementos.push(span);
});

/* ANIMACIÓN */
let i=0;
let intervalo=setInterval(()=>{
    if(i<elementos.length){
        elementos[i].classList.add("show");
        i++;
    }else{
        clearInterval(intervalo);
        heart.classList.add("latir");
        elementos.forEach(e=>e.classList.add("colorChange"));

        // Mostrar mensaje
        setTimeout(()=>{
            mensaje.style.opacity=1;
        },1500);

        // EXPLOSIÓN
        setTimeout(explosion,3000);
    }
},30);

/* EMOJIS */
let emojis=["💖","❤️","💘","💕","💞","💓"];
for(let i=0;i<60;i++){
    let e=document.createElement("div");
    e.className="emoji";
    e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=(4+Math.random()*6)+"s";
    e.style.fontSize=(15+Math.random()*25)+"px";
    document.body.appendChild(e);
}

/* ESTRELLAS */
for(let i=0;i<80;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    document.body.appendChild(s);
}

/* EXPLOSIÓN FINAL */
function explosion(){
    for(let i=0;i<80;i++){
        let h=document.createElement("div");
        h.innerText="💖";
        h.style.position="absolute";
        h.style.left="50%";
        h.style.top="50%";
        h.style.fontSize="20px";

        let angle=Math.random()*360;
        let distance=Math.random()*300;

        h.animate([
            {transform:"translate(0,0)",opacity:1},
            {transform:`translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`,opacity:0}
        ],{
            duration:2000
        });

        document.body.appendChild(h);
        setTimeout(()=>h.remove(),2000);
    }
}
</script>

</body>
</html>
